spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/FlyNowDatabase
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
logging:
  level:
    sql: debug
management:
  endpoints:
    web:
      exposure:
        include: beans
