spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create
#      ddl-auto: update
    show-sql: true
logging:
  level:
    com.flynow: DEBUG
    sql: debug
management:
  endpoints:
    web:
      exposure:
        include: beans
springdoc:
  swagger-ui:
    path: /swagger-ui
